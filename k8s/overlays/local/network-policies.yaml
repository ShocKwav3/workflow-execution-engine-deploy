            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [api, outbox-relay, executor, migrate]
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
