apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: workflow-engine

labels:
  - pairs:
      app.kubernetes.io/part-of: workflow-engine
    includeSelectors: false

resources:
  - ../../base
  - app-env-external-secret.yaml
  - app-secrets-external-secret.yaml

images:
  - name: workflow-engine/api
    newTag: unset
  - name: workflow-engine/outbox-relay
    newTag: unset
  - name: workflow-engine/executor
    newTag: unset
  - name: workflow-engine/migrate
    newTag: unset

# Appends the migrate image tag to the Job name, so each tag gets a new Job.
replacements:
  - source:
      kind: Job
      name: migrate
      fieldPath: spec.template.spec.containers.[name=migrate].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Job
          name: migrate
        fieldPaths:
          - metadata.name
        options:
          delimiter: "-"
          index: 1

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - PGPORT=5432
      - PGDATABASE=workflow_db
      - PGUSER=workflow

# The endpoints come from SSM Parameter Store through the app-env Secret.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: app-env
  - target:
      kind: Job
      name: migrate
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/env/0/name
        value: PGHOST
      - op: replace
        path: /spec/template/spec/containers/0/env/0/valueFrom
        value:
          secretKeyRef:
            name: app-env
            key: PGHOST
