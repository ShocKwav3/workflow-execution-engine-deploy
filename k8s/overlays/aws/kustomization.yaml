apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: workflow-engine

labels:
  - pairs:
      app.kubernetes.io/part-of: workflow-engine
    includeSelectors: false

resources:
  - ../../base
  - app-env-external-secret.yaml
  - app-secrets-external-secret.yaml

images:
  - name: workflow-engine/api
    newTag: unset
  - name: workflow-engine/outbox-relay
    newTag: unset
  - name: workflow-engine/executor
    newTag: unset
  - name: workflow-engine/migrate
    newTag: unset

# Appends the migrate image tag to the Job name, so each tag gets a new Job.
replacements:
  - source:
      kind: Job
      name: migrate
      fieldPath: spec.template.spec.containers.[name=migrate].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Job
          name: migrate
        fieldPaths:
          - metadata.name
        options:
          delimiter: "-"
          index: 1

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - PGPORT=5432
      - PGDATABASE=workflow_db
      - PGUSER=workflow
      - PGSSLMODE=verify-full
      - PGSSLROOTCERT=/etc/rds-ca/global-bundle.pem
  # The global bundle covers every commercial region, so no region is named here.
  - name: rds-ca
    files:
      - rds-ca/global-bundle.pem

patches:
  - path: api-service-patch.yaml
  # The endpoints come from SSM Parameter Store through the app-env Secret.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: app-env
  - target:
      kind: Job
      name: migrate
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/env/0/name
        value: PGHOST
      - op: replace
        path: /spec/template/spec/containers/0/env/0/valueFrom
        value:
          secretKeyRef:
            name: app-env
            key: PGHOST
  # The RDS CA bundle for verify-full TLS.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: rds-ca
            configMap:
              name: rds-ca
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: rds-ca
            mountPath: /etc/rds-ca
            readOnly: true
  # Liquibase uses pgjdbc, which takes the TLS settings as JDBC URL parameters.
  - target:
      kind: Job
      name: migrate
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: rds-ca
            configMap:
              name: rds-ca
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: rds-ca
            mountPath: /etc/rds-ca
            readOnly: true
      - op: test
        path: /spec/template/spec/containers/0/args/2
        value: --url=jdbc:postgresql://$(PGHOST):$(PGPORT)/$(PGDATABASE)
      - op: replace
        path: /spec/template/spec/containers/0/args/2
        value: --url=jdbc:postgresql://$(PGHOST):$(PGPORT)/$(PGDATABASE)?sslmode=verify-full&sslrootcert=/etc/rds-ca/global-bundle.pem
