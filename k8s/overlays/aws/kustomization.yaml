apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: workflow-engine

labels:
  - pairs:
      app.kubernetes.io/part-of: workflow-engine
    includeSelectors: false

resources:
  - ../../base
  - app-env-external-secret.yaml
  - app-secrets-external-secret.yaml
  - network-policies.yaml

images:
  - name: workflow-engine/api
    newTag: unset
  - name: workflow-engine/outbox-relay
    newTag: unset
  - name: workflow-engine/executor
    newTag: unset
  - name: workflow-engine/migrate
    newTag: unset

# Appends the migrate image tag to the Job name, so each tag gets a new Job.
replacements:
  - source:
      kind: Job
      name: migrate
      fieldPath: spec.template.spec.containers.[name=migrate].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Job
          name: migrate
        fieldPaths:
          - metadata.name
        options:
          delimiter: "-"
          index: 1

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - PGPORT=5432
      - PGDATABASE=workflow_db
      - PGUSER=workflow
      - PGSSLMODE=verify-full
      - PGSSLROOTCERT=/etc/rds-ca/global-bundle.pem
      - PGHOST_FILE=/etc/secrets/env/PGHOST
      - REDIS_URL_FILE=/etc/secrets/env/REDIS_URL
  # The global bundle covers every commercial region, so no region is named here.
  - name: rds-ca
    files:
      - rds-ca/global-bundle.pem

patches:
  - path: api-service-patch.yaml
  # A Pod is Ready only when its NLB target is healthy, so a rollout keeps the old Pod until then.
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: workflow-engine
        labels:
          elbv2.k8s.aws/pod-readiness-gate-inject: enabled
  # Temporary: images before PGHOST_FILE and REDIS_URL_FILE still read the variables. Remove after their rollout.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: app-env
  # The endpoints come from SSM Parameter Store through the app-env Secret, read as files (PGHOST_FILE, REDIS_URL_FILE).
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: app-env
          secret:
            secretName: app-env
            defaultMode: 0440
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: app-env
          mountPath: /etc/secrets/env
          readOnly: true
  - target:
      kind: Job
      name: migrate
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/env/0/name
        value: PGHOST
      - op: replace
        path: /spec/template/spec/containers/0/env/0/valueFrom
        value:
          secretKeyRef:
            name: app-env
            key: PGHOST
  # The RDS CA bundle for verify-full TLS.
  - target:
      kind: Deployment
    patch: |-
      # Appends: an add on the list path replaces the list, which drops the base volumes.
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: rds-ca
          configMap:
            name: rds-ca
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: rds-ca
          mountPath: /etc/rds-ca
          readOnly: true
  # Liquibase uses pgjdbc, which takes the TLS settings as JDBC URL parameters.
  - target:
      kind: Job
      name: migrate
    patch: |-
      # Appends: an add on the list path replaces the list, which drops the base volumes.
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: rds-ca
          configMap:
            name: rds-ca
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: rds-ca
          mountPath: /etc/rds-ca
          readOnly: true
      - op: test
        path: /spec/template/spec/containers/0/args/2
        value: --url=jdbc:postgresql://$(PGHOST):$(PGPORT)/$(PGDATABASE)
      - op: replace
        path: /spec/template/spec/containers/0/args/2
        value: --url=jdbc:postgresql://$(PGHOST):$(PGPORT)/$(PGDATABASE)?sslmode=verify-full&sslrootcert=/etc/rds-ca/global-bundle.pem
