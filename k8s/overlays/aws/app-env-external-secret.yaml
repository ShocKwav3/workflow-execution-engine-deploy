apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-env
spec:
  refreshInterval: 1h
  # Created with the ESO installation, so the region stays out of this repository.
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: app-env
    creationPolicy: Owner
  data:
    - secretKey: PGHOST
      remoteRef:
        key: /wee/app/PGHOST
    - secretKey: REDIS_URL
      remoteRef:
        key: /wee/app/REDIS_URL
