apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
spec:
  refreshInterval: 1h
  # Created with the ESO installation, so the region stays out of this repository.
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: app-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        PGPASSWORD: "{{ .password }}"
  # RDS names its managed secret rds!db-<uuid>, and the uuid changes with each instance.
  dataFrom:
    - find:
        path: "rds!db-"
        name:
          regexp: "^rds!db-"
      rewrite:
        - merge:
            strategy: Extract
            conflictPolicy: Error
