# RDS and ElastiCache IPs can change, their subnets cannot: the private subnets of infra/terraform/env/network.tf.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-clients-egress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [api, outbox-relay, executor, migrate]
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.128.0/20
        - ipBlock:
            cidr: 10.0.144.0/20
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-clients-egress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [outbox-relay, executor]
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.128.0/20
        - ipBlock:
            cidr: 10.0.144.0/20
      ports:
        - protocol: TCP
          port: 6379
