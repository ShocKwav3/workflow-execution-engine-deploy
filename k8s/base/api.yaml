apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
  annotations:
    checkov.io/skip1: "CKV_K8S_11=No CPU limit: a limit throttles the container while the node has free CPU"
    checkov.io/skip2: "CKV_K8S_15=The image is loaded into the node or pinned, so a pull on each start adds nothing"
    checkov.io/skip3: "CKV_K8S_43=The tag is a commit SHA; the deploy sets the digest after the registry push"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      # Must exceed the preStop sleep plus the app's 8 s forced exit.
      terminationGracePeriodSeconds: 20
      # No program in this Pod calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Above 10000, so the UID matches no user on the node.
        runAsUser: 10001
        runAsGroup: 10001
        # Group owner of the mounted Secret files.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: app-secrets
          secret:
            secretName: app-secrets
            # Readable by the Pod's fsGroup only.
            defaultMode: 0440
      containers:
        - name: api
          image: workflow-engine/api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The only writable path: the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
            - name: app-secrets
              mountPath: /etc/secrets/app
              readOnly: true
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            # Temporary: images before the password file still read PGPASSWORD. Remove after their rollout.
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            # Keeps serving while the Pod is removed from the Service endpoints.
            preStop:
              sleep:
                seconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  # Each overlay patches this to LoadBalancer.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
