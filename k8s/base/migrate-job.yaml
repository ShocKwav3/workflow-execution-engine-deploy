apiVersion: batch/v1
kind: Job
metadata:
  # Each overlay appends the image tag: the Pod template of a Job is immutable.
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
  annotations:
    checkov.io/skip1: "CKV_K8S_11=No CPU limit: a limit throttles the container while the node has free CPU"
    checkov.io/skip2: "CKV_K8S_15=The image is loaded into the node or pinned, so a pull on each start adds nothing"
    checkov.io/skip3: "CKV_K8S_43=The tag is a commit SHA; the deploy sets the digest after the registry push"
    checkov.io/skip4: "CKV_K8S_35=Liquibase reads a password only from arguments, environment variables or a properties file"
    checkov.io/skip5: "CKV_K8S_40=Runs as the user of the upstream Liquibase image, which owns /liquibase"
spec:
  # Retries cover a database that is not ready yet; a broken changeset fails every attempt.
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: Never
      # No program in this Pod calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The Liquibase image's own user: other UIDs cannot enter /liquibase. The image sets it by name.
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: migrate
          image: workflow-engine/migrate
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The only writable path: the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
          args:
            - update
            - --changelog-file=db.changelog-master.yaml
            - --url=jdbc:postgresql://$(PGHOST):$(PGPORT)/$(PGDATABASE)
            - --username=$(PGUSER)
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PGHOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PGPORT
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PGDATABASE
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PGUSER
            # Liquibase reads this variable; the password stays out of the process arguments.
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PGPASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
