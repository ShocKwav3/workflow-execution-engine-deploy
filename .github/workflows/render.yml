name: render

on:
  workflow_call:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Create the local secret file
        run: cp k8s/overlays/local/secret.env.example k8s/overlays/local/secret.env

      - name: Render k8s/overlays/local
        run: |
          mkdir -p rendered
          kubectl kustomize k8s/overlays/local > rendered/local.yaml

      - name: Render k8s/overlays/aws
        run: kubectl kustomize k8s/overlays/aws > rendered/aws.yaml

      - name: Upload the rendered overlays for the config scan
        uses: actions/upload-artifact@v7
        with:
          name: rendered
          path: rendered
          if-no-files-found: error
          retention-days: 1

      - name: Compare redis.conf with the app repository
        run: |
          curl -fsSL https://raw.githubusercontent.com/ShocKwav3/workflow-execution-engine/main/infra/redis/redis.conf -o upstream-redis.conf
          diff upstream-redis.conf k8s/overlays/local/redis/redis.conf
