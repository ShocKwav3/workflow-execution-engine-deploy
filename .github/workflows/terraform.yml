name: terraform

on:
  workflow_call:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Terraform 1.17.0
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Check the format
        run: terraform fmt -check -recursive infra/terraform

      # -backend=false: init installs the providers but does not touch the S3 state, so no AWS access is needed
      - name: Validate each configuration
        run: |
          for config in bootstrap env cluster-addons; do
            echo "==> $config"
            terraform -chdir="infra/terraform/$config" init -backend=false -input=false
            terraform -chdir="infra/terraform/$config" validate
          done
